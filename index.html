<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مینی‌اپ کریپتو لایو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .pulse-live { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        #loadingScreen { transition: opacity 0.4s ease; }
    </style>
</head>
<body class="min-h-screen p-4 pb-20">

    <!-- صفحه لودینگ اولیه -->
    <div id="loadingScreen" class="fixed inset-0 bg-[#0b0f19] z-50 flex flex-col items-center justify-center space-y-4">
        <div class="relative w-16 h-16">
            <div class="absolute inset-0 border-4 border-blue-500/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-blue-500 rounded-full border-t-transparent animate-spin"></div>
        </div>
        <div class="text-blue-400 font-bold text-sm tracking-wide animate-pulse">در حال اتصال به بازار جهانی...</div>
    </div>

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- هدر و وضعیت زنده + دکمه رفرش دستی -->
        <div class="glass-card rounded-2xl p-4 flex items-center justify-between shadow-lg">
            <div>
                <h1 class="text-base font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">بازار لحظه‌ای ارزهای دیجیتال</h1>
                <p class="text-[11px] text-gray-400 mt-0.5">آپدیت خودکار (هر ۲ ثانیه)</p>
            </div>
            <div class="flex items-center space-x-2 space-x-reverse">
                <!-- دکمه رفرش دستی -->
                <button onclick="manualRefresh()" id="refreshBtn" class="bg-blue-500/10 hover:bg-blue-500/20 border border-blue-500/30 p-2 rounded-xl text-blue-400 transition-all active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
                <div class="flex items-center space-x-1.5 space-x-reverse bg-green-500/10 border border-green-500/20 px-2.5 py-1 rounded-full">
                    <div class="w-2 h-2 bg-green-500 rounded-full pulse-live"></div>
                    <span class="text-[11px] text-green-400 font-medium">لایو</span>
                </div>
            </div>
        </div>

        <!-- سرچ‌بار -->
        <div class="relative">
            <input type="text" id="searchInput" placeholder="جستجوی ارز (مثل بیت‌کوین، اتریوم)..." class="w-full glass-card rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white placeholder-gray-500 shadow-inner">
        </div>

        <!-- لیست قیمت‌ها -->
        <div id="cryptoList" class="space-y-3"></div>
    </div>

    <script>
        let allCoins = [];

        async function fetchCryptoPrices(isInitial = false) {
            const container = document.getElementById('cryptoList');
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=15&page=1&sparkline=false');
                
                if (!response.ok) throw new Error('خطا در دریافت اطلاعات');

                const data = await response.json();
                allCoins = data;
                renderList(allCoins);
            } catch (error) {
                console.error('Error fetching data:', error);
                if (isInitial) {
                    container.innerHTML = `<div class="text-center py-8 text-red-400 text-sm glass-card rounded-2xl">خطا در بارگذاری قیمت‌ها! لطفاً دوباره تلاش کنید.</div>`;
                }
            } finally {
                if (isInitial) {
                    const loader = document.getElementById('loadingScreen');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 400);
                }
            }
        }

        function manualRefresh() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('animate-spin');
            fetchCryptoPrices(false).then(() => {
                setTimeout(() => btn.classList.remove('animate-spin'), 600);
            });
        }

        function renderList(coins) {
            const container = document.getElementById('cryptoList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            container.innerHTML = '';
            
            const filtered = coins.filter(coin => coin.name.toLowerCase().includes(search) || coin.symbol.toLowerCase().includes(search));
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-gray-500 text-sm">ارزی پیدا نشد!</div>';
                return;
            }

            filtered.forEach(coin => {
                const isPositive = coin.price_change_percentage_24h >= 0;
                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl p-4 flex items-center justify-between transition-all hover:border-blue-500/50 shadow-md";
                card.innerHTML = `
                    <div class="flex items-center space-x-3 space-x-reverse">
                        <img src="${coin.image}" alt="${coin.name}" class="w-10 h-10 rounded-full bg-gray-800 p-1">
                        <div>
                            <h3 class="font-bold text-white text-sm">${coin.name}</h3>
                            <span class="text-xs uppercase text-gray-400 font-semibold">${coin.symbol}</span>
                        </div>
                    </div>
                    <div class="text-left">
                        <div class="font-bold text-white text-sm">$${coin.current_price.toLocaleString()}</div>
                        <div class="text-xs font-semibold ${isPositive ? 'text-green-400' : 'text-red-400'} mt-0.5">
                            ${isPositive ? '+' : ''}${coin.price_change_percentage_24h ? coin.price_change_percentage_24h.toFixed(2) : '0.00'}%
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            renderList(allCoins);
        });

        // دریافت اولیه همراه با لودینگ
        fetchCryptoPrices(true);

        // آپدیت خودکار هر ۲ ثانیه یک‌بار
        setInterval(() => fetchCryptoPrices(false), 2000);
    </script>
</body>
</html>
