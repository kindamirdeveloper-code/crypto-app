<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مینی‌اپ کریپتو بایننس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #07090e; color: #f3f4f6; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.06); }
        .pulse-live { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        #loadingScreen { transition: opacity 0.5s ease, visibility 0.5s ease; }
        .flash-green { color: #22c55e !important; transform: scale(1.02); transition: all 0.3s ease; }
        .flash-red { color: #ef4444 !important; transform: scale(1.02); transition: all 0.3s ease; }
    </style>
</head>
<body class="min-h-screen pb-28 selection:bg-blue-500 selection:text-white">

    <!-- صفحه لودینگ مدرن و مینیمال -->
    <div id="loadingScreen" class="fixed inset-0 bg-[#07090e] z-50 flex flex-col items-center justify-center space-y-5">
        <div class="relative w-16 h-16">
            <div class="absolute inset-0 border-3 border-blue-500/20 rounded-full"></div>
            <div class="absolute inset-0 border-3 border-blue-500 rounded-full border-t-transparent animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center text-xs font-bold text-blue-400">BNB</div>
        </div>
        <div class="text-center space-y-1">
            <div class="text-white font-semibold text-sm">در حال اتصال به سرور بایننس...</div>
            <div class="text-gray-500 text-[11px]">دریافت قیمت‌های لحظه‌ای ۱۰۰ ارز برتر</div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- صفحه اصلی -->
        <div id="homeView" class="space-y-4">
            <!-- هدر پاکسازی شده و مدرن -->
            <div class="glass-card rounded-2xl p-4 flex items-center justify-between shadow-xl">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-400 flex items-center justify-center text-black font-black text-sm shadow-lg shadow-amber-500/20">
                        ⚡
                    </div>
                    <div>
                        <h1 class="text-sm font-bold text-white tracking-wide">بایننس لایو استریم</h1>
                        <div class="flex items-center space-x-1.5 space-x-reverse mt-0.5">
                            <span class="w-2 h-2 bg-emerald-500 rounded-full pulse-live"></span>
                            <span class="text-[11px] text-emerald-400 font-medium">آپدیت آنلاین (۱ ثانیه)</span>
                        </div>
                    </div>
                </div>
                <button onclick="manualRefresh()" id="refreshBtn" class="bg-white/5 hover:bg-white/10 border border-white/10 p-2.5 rounded-xl text-gray-300 hover:text-white transition-all active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>

            <!-- سرچ‌بار پیشرفته -->
            <div class="relative">
                <span class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-gray-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="searchInput" placeholder="جستجو میان ۱۰۰ ارز برتر بایننس..." class="w-full glass-card rounded-2xl pr-11 pl-4 py-3.5 text-xs focus:outline-none focus:border-blue-500/50 text-white placeholder-gray-500 shadow-inner transition-all">
            </div>

            <!-- لیست ارزها -->
            <div id="cryptoList" class="space-y-2.5"></div>
        </div>

        <!-- صفحه دونیت -->
        <div id="donateView" class="space-y-4 hidden pt-6">
            <div class="glass-card rounded-3xl p-6 text-center space-y-4 shadow-xl border border-white/5">
                <div class="w-16 h-16 bg-gradient-to-tr from-blue-500/20 to-purple-500/20 border border-blue-500/30 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
                    💎
                </div>
                <div class="space-y-1">
                    <h2 class="text-base font-bold text-white">حمایت از توسعه‌دهنده</h2>
                    <p class="text-xs text-gray-400 leading-relaxed">برای استمرار و توسعه امکانات پیشرفته، می‌توانید از پروژه حمایت کنید.</p>
                </div>
                <div class="p-4 rounded-2xl bg-white/5 border border-white/5 text-xs text-gray-300 font-mono">
                    USDT (TRC20): <br><span class="text-blue-400 select-all font-bold mt-1 block">TYourWalletAddressHere...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- منوی ناوبری مدرن پایین صفحه -->
    <div class="fixed bottom-3 left-4 right-4 bg-[#111827]/80 backdrop-blur-2xl border border-white/10 py-2 px-3 rounded-2xl z-40 max-w-sm mx-auto shadow-2xl">
        <div class="flex justify-around items-center">
            <button onclick="switchTab('home')" id="navHome" class="flex items-center space-x-2 space-x-reverse px-5 py-2 rounded-xl transition-all duration-300 bg-blue-600 text-white shadow-lg shadow-blue-600/30">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-xs font-bold nav-text">بازار زنده</span>
            </button>
            <button onclick="switchTab('donate')" id="navDonate" class="flex items-center space-x-2 space-x-reverse px-4 py-2 rounded-xl transition-all duration-300 text-gray-400 hover:text-white">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                <span class="text-xs font-bold nav-text hidden">حمایت</span>
            </button>
        </div>
    </div>

    <script>
        let allCoins = [];
        let previousPrices = {};

        function formatPrice(price) {
            if (price < 0.0001) return price.toFixed(6);
            if (price < 1) return price.toFixed(4);
            if (price < 10) return price.toFixed(3);
            return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function fetchBinancePrices(isInitial = false) {
            const container = document.getElementById('cryptoList');
            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                if (!response.ok) throw new Error('خطا در ارتباط با بایننس');
                
                let data = await response.json();
                
                data = data.filter(item => item.symbol.endsWith('USDT') && !item.symbol.includes('UP') && !item.symbol.includes('DOWN'))
                           .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
                           .slice(0, 100);

                data.forEach(item => {
                    const current = parseFloat(item.lastPrice);
                    item.symbolClean = item.symbol.replace('USDT', '');
                    item.price = current;
                    item.change24h = parseFloat(item.priceChangePercent);

                    if (previousPrices[item.symbol] !== undefined) {
                        if (current > previousPrices[item.symbol]) {
                            item.flash = 'flash-green';
                        } else if (current < previousPrices[item.symbol]) {
                            item.flash = 'flash-red';
                        } else {
                            item.flash = '';
                        }
                    } else {
                        item.flash = '';
                    }
                    previousPrices[item.symbol] = current;
                });

                allCoins = data;
                renderList(allCoins);
            } catch (error) {
                console.error('Binance fetch error:', error);
                if (isInitial) {
                    container.innerHTML = `<div class="text-center py-8 text-red-400 text-xs glass-card rounded-2xl">خطا در دریافت اطلاعات از بایننس. لطفاً دوباره تلاش کنید.</div>`;
                }
            } finally {
                if (isInitial) {
                    const loader = document.getElementById('loadingScreen');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }
            }
        }

        function manualRefresh() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('animate-spin');
            fetchBinancePrices(false).then(() => {
                setTimeout(() => btn.classList.remove('animate-spin'), 600);
            });
        }

        function renderList(coins) {
            const container = document.getElementById('cryptoList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            container.innerHTML = '';
            
            const filtered = coins.filter(c => c.symbolClean.toLowerCase().includes(search));
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-gray-500 text-xs">ارزی با این مشخصات یافت نشد!</div>';
                return;
            }

            filtered.forEach(coin => {
                const isPositive = coin.change24h >= 0;
                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl p-3.5 flex items-center justify-between transition-all hover:border-blue-500/40 shadow-sm";
                card.innerHTML = `
                    <div class="flex items-center space-x-3 space-x-reverse">
                        <div class="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center font-bold text-xs text-amber-400">
                            ${coin.symbolClean.substring(0, 3)}
                        </div>
                        <div>
                            <h3 class="font-bold text-white text-xs">${coin.symbolClean}</h3>
                            <span class="text-[10px] text-gray-400">USDT Market</span>
                        </div>
                    </div>
                    <div class="text-left">
                        <div class="font-mono font-bold text-xs ${coin.flash || 'text-white'}">$${formatPrice(coin.price)}</div>
                        <div class="text-[10px] font-semibold ${isPositive ? 'text-emerald-400' : 'text-rose-400'} mt-0.5">
                            ${isPositive ? '+' : ''}${coin.change24h.toFixed(2)}%
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function switchTab(tab) {
            const homeView = document.getElementById('homeView');
            const donateView = document.getElementById('donateView');
            const navHome = document.getElementById('navHome');
            const navDonate = document.getElementById('navDonate');

            if (tab === 'home') {
                homeView.classList.remove('hidden');
                donateView.classList.add('hidden');

                navHome.className = "flex items-center space-x-2 space-x-reverse px-5 py-2 rounded-xl transition-all duration-300 bg-blue-600 text-white shadow-lg shadow-blue-600/30";
                navHome.querySelector('.nav-text').classList.remove('hidden');

                navDonate.className = "flex items-center space-x-2 space-x-reverse px-4 py-2 rounded-xl transition-all duration-300 text-gray-400 hover:text-white";
                navDonate.querySelector('.nav-text').classList.add('hidden');
            } else {
                homeView.classList.add('hidden');
                donateView.classList.remove('hidden');

                navDonate.className = "flex items-center space-x-2 space-x-reverse px-5 py-2 rounded-xl transition-all duration-300 bg-blue-600 text-white shadow-lg shadow-blue-600/30";
                navDonate.querySelector('.nav-text').classList.remove('hidden');

                navHome.className = "flex items-center space-x-2 space-x-reverse px-4 py-2 rounded-xl transition-all duration-300 text-gray-400 hover:text-white";
                navHome.querySelector('.nav-text').classList.add('hidden');
            }
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            renderList(allCoins);
        });

        fetchBinancePrices(true);
        setInterval(() => fetchBinancePrices(false), 1000);
    </script>
</body>
</html>
