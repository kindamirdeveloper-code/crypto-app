<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مینی‌اپ کریپتو لایو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .pulse-live { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } p50% { opacity: 0.4; } }
        #loadingScreen { transition: opacity 0.5s ease; }
        .price-flash-up { color: #4ade80 !important; transition: color 0.3s ease; }
        .price-flash-down { color: #f87171 !important; transition: color 0.3s ease; }
    </style>
</head>
<body class="min-h-screen pb-28">

    <!-- صفحه لودینگ مدرن و حرفه‌ای -->
    <div id="loadingScreen" class="fixed inset-0 bg-[#0b0f19] z-50 flex flex-col items-center justify-center space-y-6">
        <div class="relative w-20 h-20">
            <div class="absolute inset-0 border-4 border-blue-500/10 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-blue-500 rounded-full border-t-transparent animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center font-bold text-xs text-blue-400">CRYPTO</div>
        </div>
        <div class="text-center space-y-1">
            <div class="text-white font-bold text-base tracking-wide">در حال راه‌اندازی مینی‌اپ...</div>
            <div class="text-blue-400/80 text-xs animate-pulse">اتصال به لایو استریم ۱۰۰ ارز برتر</div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- صفحه اصلی (Home View) -->
        <div id="homeView" class="space-y-4">
            <!-- هدر و وضعیت زنده + دکمه رفرش دستی -->
            <div class="glass-card rounded-2xl p-4 flex items-center justify-between shadow-lg">
                <div>
                    <h1 class="text-base font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">بازار لحظه‌ای (۱۰۰ ارز برتر)</h1>
                    <p class="text-[11px] text-gray-400 mt-0.5">آپدیت آنی (هر ۱ ثانیه)</p>
                </div>
                <div class="flex items-center space-x-2 space-x-reverse">
                    <button onclick="manualRefresh()" id="refreshBtn" class="bg-blue-500/10 hover:bg-blue-500/20 border border-blue-500/30 p-2 rounded-xl text-blue-400 transition-all active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                    <div class="flex items-center space-x-1.5 space-x-reverse bg-green-500/10 border border-green-500/20 px-2.5 py-1 rounded-full">
                        <div class="w-2 h-2 bg-green-500 rounded-full pulse-live"></div>
                        <span class="text-[11px] text-green-400 font-medium">لایو</span>
                    </div>
                </div>
            </div>

            <!-- سرچ‌بار -->
            <div class="relative">
                <input type="text" id="searchInput" placeholder="جستجوی ارز بین ۱۰۰ ارز برتر..." class="w-full glass-card rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white placeholder-gray-500 shadow-inner">
            </div>

            <!-- لیست قیمت‌ها (price) -->
            <div id="cryptoList" class="space-y-3"></div>
        </div>

        <!-- صفحه دونیت (Donate View - خالی) -->
        <div id="donateView" class="space-y-4 hidden pt-6">
            <div class="glass-card rounded-2xl p-6 text-center space-y-4">
                <div class="w-16 h-16 bg-blue-500/10 border border-blue-500/20 rounded-full flex items-center justify-center mx-auto text-blue-400 text-2xl">
                    💎
                </div>
                <h2 class="text-lg font-bold text-white">حمایت از توسعه‌دهنده</h2>
                <p class="text-xs text-gray-400 leading-relaxed">این بخش به‌زودی فعال می‌شود. از حمایت و همراهی شما سپاسگزاریم.</p>
            </div>
        </div>
    </div>

    <!-- منوی پایین صفحه (Telegram Style Navigation Bar) -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#0b0f19]/90 backdrop-blur-xl border-t border-white/10 py-2.5 px-6 z-40 max-w-md mx-auto">
        <div class="flex justify-around items-center">
            <!-- تب خانه -->
            <button onclick="switchTab('home')" id="navHome" class="flex items-center space-x-2 space-x-reverse px-4 py-2 rounded-xl transition-all bg-blue-500/15 text-blue-400 border border-blue-500/20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-xs font-bold nav-text">صفحه اصلی</span>
            </button>

            <!-- تب دونیت -->
            <button onclick="switchTab('donate')" id="navDonate" class="flex items-center space-x-2 space-x-reverse px-4 py-2 rounded-xl transition-all text-gray-400 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                <span class="text-xs font-bold nav-text hidden">دونیت</span>
            </button>
        </div>
    </div>

    <script>
        let allCoins = [];
        let previousPrices = {};

        async function fetchCryptoPrices(isInitial = false) {
            const container = document.getElementById('cryptoList');
            try {
                // دریافت 100 ارز برتر
                const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false');
                
                if (!response.ok) throw new Error('خطا در دریافت اطلاعات');

                const data = await response.json();
                
                // بررسی تغییرات قیمت برای فلش زدن رنگ‌ها
                data.forEach(coin => {
                    if (previousPrices[coin.id] !== undefined) {
                        if (coin.current_price > previousPrices[coin.id]) {
                            coin.flash = 'up';
                        } else if (coin.current_price < previousPrices[coin.id]) {
                            coin.flash = 'down';
                        } else {
                            coin.flash = 'none';
                        }
                    } else {
                        coin.flash = 'none';
                    }
                    previousPrices[coin.id] = coin.current_price;
                });

                allCoins = data;
                renderList(allCoins);
            } catch (error) {
                console.error('Error fetching data:', error);
                if (isInitial) {
                    container.innerHTML = `<div class="text-center py-8 text-red-400 text-sm glass-card rounded-2xl">خطا در بارگذاری قیمت‌ها! لطفاً دوباره تلاش کنید.</div>`;
                }
            } finally {
                if (isInitial) {
                    const loader = document.getElementById('loadingScreen');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }
            }
        }

        function manualRefresh() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('animate-spin');
            fetchCryptoPrices(false).then(() => {
                setTimeout(() => btn.classList.remove('animate-spin'), 600);
            });
        }

        function renderList(coins) {
            const container = document.getElementById('cryptoList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            container.innerHTML = '';
            
            const filtered = coins.filter(coin => coin.name.toLowerCase().includes(search) || coin.symbol.toLowerCase().includes(search));
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-gray-500 text-sm">ارزی پیدا نشد!</div>';
                return;
            }

            filtered.forEach(coin => {
                const isPositive = coin.price_change_percentage_24h >= 0;
                let priceClass = "text-white";
                if (coin.flash === 'up') priceClass = "price-flash-up font-bold";
                if (coin.flash === 'down') priceClass = "price-flash-down font-bold";

                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl p-4 flex items-center justify-between transition-all hover:border-blue-500/50 shadow-md";
                card.innerHTML = `
                    <div class="flex items-center space-x-3 space-x-reverse">
                        <img src="${coin.image}" alt="${coin.name}" class="w-10 h-10 rounded-full bg-gray-800 p-1">
                        <div>
                            <h3 class="font-bold text-white text-sm">${coin.name}</h3>
                            <span class="text-xs uppercase text-gray-400 font-semibold">${coin.symbol}</span>
                        </div>
                    </div>
                    <div class="text-left">
                        <div class="font-bold text-sm ${priceClass}">$${coin.current_price.toLocaleString()}</div>
                        <div class="text-xs font-semibold ${isPositive ? 'text-green-400' : 'text-red-400'} mt-0.5">
                            ${isPositive ? '+' : ''}${coin.price_change_percentage_24h ? coin.price_change_percentage_24h.toFixed(2) : '0.00'}%
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function switchTab(tab) {
            const homeView = document.getElementById('homeView');
            const donateView = document.getElementById('donateView');
            const navHome = document.getElementById('navHome');
            const navDonate = document.getElementById('navDonate');

            if (tab === 'home') {
                homeView.classList.remove('hidden');
                donateView.classList.add('hidden');

                navHome.className = "flex items-center space-x-2 space-x-reverse px-4 py-2 rounded-xl transition-all bg-blue-500/15 text-blue-400 border border-blue-500/20";
                navHome.querySelector('.nav-text').classList.remove('hidden');

                navDonate.className = "flex items-center space-x-2 space-x-reverse px-4 py-2 rounded-xl transition-all text-gray-400 hover:text-white";
                navDonate.querySelector('.nav-text').classList.add('hidden');
            } else {
                homeView.classList.add('hidden');
                donateView.classList.remove('hidden');

                navDonate.className = "flex items-center space-x-2 space-x-reverse px-4 py-2 rounded-xl transition-all bg-blue-500/15 text-blue-400 border border-blue-500/20";
                navDonate.querySelector('.nav-text').classList.remove('hidden');

                navHome.className = "flex items-center space-x-2 space-x-reverse px-4 py-2 rounded-xl transition-all text-gray-400 hover:text-white";
                navHome.querySelector('.nav-text').classList.add('hidden');
            }
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            renderList(allCoins);
        });

        // لود اولیه با صفحه لودینگ مدرن
        fetchCryptoPrices(true);

        // آپدیت خودکار هر ۱ ثانیه یک‌بار برای قیمت‌های لحظه‌ای
        setInterval(() => fetchCryptoPrices(false), 1000);
    </script>
</body>
</html>
