<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binance Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b0e11; 
            color: #eaecef; 
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .binance-spinner {
            border: 3px solid rgba(252, 213, 53, 0.1);
            border-top-color: #fcd535;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 0.8s linear infinite !important;
        }
        .text-binance-yellow { color: #fcd535; }
        .bg-binance-yellow { background-color: #fcd535; }
        .text-binance-green { color: #0ecb81; }
        .text-binance-red { color: #f6465d; }
        .b-card { background-color: #181a20; }
        .b-input { background-color: #2b3139; color: #eaecef; }
        .b-input::placeholder { color: #848e9c; }
        @keyframes flashGreen {
            0% { color: #0ecb81; text-shadow: 0 0 10px rgba(14, 203, 129, 0.5); transform: scale(1.02); }
            100% { color: inherit; text-shadow: none; transform: scale(1); }
        }
        @keyframes flashRed {
            0% { color: #f6465d; text-shadow: 0 0 10px rgba(246, 70, 93, 0.5); transform: scale(1.02); }
            100% { color: inherit; text-shadow: none; transform: scale(1); }
        }
        .flash-up { animation: flashGreen 0.6s ease-out; color: #0ecb81 !important; font-weight: 600; }
        .flash-down { animation: flashRed 0.6s ease-out; color: #f6465d !important; font-weight: 600; }
        @keyframes pulse-live {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
        .live-dot { animation: pulse-live 1.5s infinite; }
        .nav-pill { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .nav-text { transition: max-width 0.3s ease, opacity 0.3s ease; }
    </style>
</head>
<body class="min-h-screen pb-24 selection:bg-[#fcd535] selection:text-black">

    <!-- Loading Screen -->
    <div id="loadingScreen" class="fixed inset-0 bg-[#0b0e11] z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="binance-spinner mb-5"></div>
        <div class="text-[#fcd535] text-lg font-bold tracking-[0.2em] ml-2">BINANCE</div>
    </div>

    <!-- Main Content Container -->
    <div class="max-w-md mx-auto w-full">
        
        <!-- PRICES TAB -->
        <div id="pricesTab" class="w-full">
            <div class="sticky top-0 z-30 bg-[#0b0e11]/95 backdrop-blur-md pt-5 pb-3 px-4 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <h1 class="text-xl font-bold text-white">Markets</h1>
                    <div class="flex items-center space-x-1.5 bg-[#2b3139] px-2 py-1 rounded-md">
                        <div class="w-1.5 h-1.5 rounded-full bg-[#0ecb81] live-dot"></div>
                        <span class="text-[10px] font-semibold text-[#848e9c] uppercase tracking-wider">Live</span>
                    </div>
                </div>
                <button onclick="manualRefresh()" class="p-2 bg-[#181a20] rounded-xl text-[#848e9c] hover:text-white transition-colors">
                    <svg id="refreshIcon" class="w-5 h-5 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>

            <!-- Search Bar -->
            <div class="px-4 mb-4">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-[#848e9c]">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                    <input type="text" id="searchInput" placeholder="Search coin..." class="w-full b-input rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-[#fcd535] transition-all">
                </div>
            </div>

            <div class="flex justify-between px-5 mb-2 text-[11px] font-medium text-[#848e9c]">
                <span>Name</span>
                <span>Last Price</span>
            </div>

            <div id="cryptoList" class="px-2 space-y-1"></div>
        </div>

        <!-- DONATE TAB -->
        <div id="donateTab" class="w-full hidden pt-10 px-4">
            <div class="b-card rounded-2xl p-6 text-center shadow-lg border border-[#2b3139]">
                <div class="w-16 h-16 mx-auto mb-4 bg-[#26A17B]/10 rounded-full flex items-center justify-center">
                    <svg class="w-10 h-10 text-[#26A17B]" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M11.944 14.86c-4.484 0-8.243-1.047-8.243-2.338 0-1.29 3.76-2.337 8.243-2.337s8.242 1.047 8.242 2.337c0 1.29-3.758 2.338-8.242 2.338zM12.057 9.38v-3.79h3.693V2.42H8.384v3.17h3.673v3.79c-4.966.173-9.056 1.455-9.056 3.012 0 1.637 4.542 2.966 10.144 2.966 5.6 0 10.142-1.33 10.142-2.966 0-1.558-4.092-2.84-9.058-3.013H12.057v7.502c-1.393-.11-2.67-.327-3.673-.61v3.313c1.233.393 2.68.653 4.153.653 1.22 0 2.457-.183 3.695-.533v-3.23c-1.258.336-2.735.59-4.172.637v-7.533z"/>
                    </svg>
                </div>
                <h2 class="text-lg font-bold text-white mb-1">Support the Project</h2>
                <p class="text-sm text-[#848e9c] mb-6">Your contributions help us maintain and improve this service.</p>
                <div class="space-y-3">
                    <div class="bg-[#0b0e11] border border-[#2b3139] rounded-xl p-3">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-semibold text-[#848e9c] bg-[#2b3139] px-2 py-0.5 rounded">USDT (TRC20)</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-[13px] font-mono text-white truncate mr-3 select-all">TSA1UT8UkV79XpRgHCCyE2FKfUauTnSa1L</span>
                            <button onclick="copyAddress('TSA1UT8UkV79XpRgHCCyE2FKfUauTnSa1L', this)" class="p-2 rounded-lg bg-[#2b3139] text-[#848e9c] hover:text-white transition-colors shrink-0">
                                <svg class="w-4 h-4 copy-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div class="bg-[#0b0e11] border border-[#2b3139] rounded-xl p-3">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-semibold text-[#848e9c] bg-[#2b3139] px-2 py-0.5 rounded">USDT (BEP20)</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-[13px] font-mono text-white truncate mr-3 select-all">0x1F4d4008c85d3f61dB2Bec735f9AB6f31C2C1B1f</span>
                            <button onclick="copyAddress('0x1F4d4008c85d3f61dB2Bec735f9AB6f31C2C1B1f', this)" class="p-2 rounded-lg bg-[#2b3139] text-[#848e9c] hover:text-white transition-colors shrink-0">
                                <svg class="w-4 h-4 copy-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL FOR TRADINGVIEW CHART (1H & 3H) -->
    <div id="chartModal" class="fixed inset-0 bg-[#0b0e11] z-50 hidden flex flex-col">
        <div class="flex items-center justify-between px-4 py-3 bg-[#181a20] border-b border-[#2b3139]">
            <div class="flex items-center space-x-2">
                <button onclick="closeChartModal()" class="p-1 rounded-lg text-[#848e9c] hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <span id="modalCoinTitle" class="font-bold text-white text-lg">BTC/USDT</span>
            </div>
            <div class="flex space-x-1 bg-[#2b3139] p-1 rounded-lg">
                <button id="tf1h" onclick="changeTimeframe('60')" class="px-3 py-1 text-xs font-semibold rounded-md bg-[#fcd535] text-black transition-colors">1H</button>
                <button id="tf3h" onclick="changeTimeframe('180')" class="px-3 py-1 text-xs font-semibold rounded-md text-[#848e9c] hover:text-white transition-colors">3H</button>
            </div>
        </div>
        <div class="flex-1 w-full bg-[#0b0e11] relative" id="tradingview_container"></div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 w-full bg-[#181a20] border-t border-[#2b3139] z-40 pb-safe">
        <div class="flex justify-around items-center px-2 py-2 max-w-md mx-auto">
            <button onclick="switchTab('prices')" id="btnPrices" class="nav-pill flex items-center space-x-2 px-4 py-2 rounded-2xl bg-[#2b3139] text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                <span id="textPrices" class="text-sm font-semibold nav-text opacity-100">Prices</span>
            </button>
            <button onclick="switchTab('donate')" id="btnDonate" class="nav-pill flex items-center space-x-2 px-4 py-2 rounded-2xl text-[#848e9c] bg-transparent">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                <span id="textDonate" class="text-sm font-semibold nav-text max-w-0 opacity-0 overflow-hidden">Donate</span>
            </button>
        </div>
    </div>

    <script>
        let allCoins = [];
        let previousPrices = {};
        let isAppReady = false;
        let currentSelectedSymbol = 'BTCUSDT';
        let currentTimeframe = '60';

        function formatPrice(price) {
            if (price < 0.0001) return price.toFixed(6);
            if (price < 1) return price.toFixed(4);
            if (price < 10) return price.toFixed(3);
            return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function initApp() {
            fetchBinancePrices();
            setTimeout(() => {
                const loader = document.getElementById('loadingScreen');
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.display = 'none';
                        isAppReady = true;
                    }, 300);
                }
            }, 600);
        }

        async function fetchBinancePrices() {
            try {
                const response = await fetch('https://api.coincap.io/v2/assets?limit=50');
                if (!response.ok) return;
                const json = await response.json();
                let data = json.data;

                let formattedData = data.map(item => {
                    const current = parseFloat(item.priceUsd);
                    const symbolClean = item.symbol.toUpperCase();
                    return {
                        symbol: symbolClean + 'USDT',
                        symbolClean: symbolClean,
                        fullName: item.name,
                        price: current,
                        change24h: parseFloat(item.changePercent24Hr || 0),
                        quoteVolume: parseFloat(item.volumeUsd24Hr || 0)
                    };
                });

                formattedData.forEach(item => {
                    const current = item.price;
                    if (previousPrices[item.symbol] !== undefined) {
                        if (current > previousPrices[item.symbol]) item.flash = 'flash-up';
                        else if (current < previousPrices[item.symbol]) item.flash = 'flash-down';
                        else item.flash = '';
                    } else {
                        item.flash = '';
                    }
                    previousPrices[item.symbol] = current;
                });

                allCoins = formattedData;
                renderList(allCoins);
            } catch (error) {}
        }

        function renderList(coins) {
            const container = document.getElementById('cryptoList');
            const searchInputElem = document.getElementById('searchInput');
            const search = searchInputElem ? searchInputElem.value.toLowerCase() : '';
            const focusedElementId = document.activeElement ? document.activeElement.id : '';
            
            const filtered = coins.filter(c => c.symbolClean.toLowerCase().includes(search) || c.fullName.toLowerCase().includes(search));
            
            let htmlContent = '';
            if (filtered.length === 0 && allCoins.length > 0) {
                htmlContent = '<div class="text-center py-10 text-[#848e9c] text-sm">No coins found</div>';
            } else {
                filtered.forEach(coin => {
                    const isPositive = coin.change24h >= 0;
                    const changeBg = isPositive ? 'bg-[#0ecb81]' : 'bg-[#f6465d]';
                    const changeSign = isPositive ? '+' : '';
                    const iconUrl = `https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1a63530be6e374711a8554f31b17e4cb92c25fa5/svg/color/${coin.symbolClean.toLowerCase()}.svg`;

                    htmlContent += `
                        <div onclick="openChart('${coin.symbol}')" class="flex items-center justify-between py-3 px-3 rounded-xl hover:bg-[#2b3139]/50 transition-colors cursor-pointer">
                            <div class="flex items-center space-x-3">
                                <img src="${iconUrl}" onerror="this.outerHTML='<div class=\\'w-8 h-8 rounded-full bg-[#2b3139] flex items-center justify-center font-bold text-xs text-[#fcd535]\\'>${coin.symbolClean.charAt(0)}</div>'" class="w-8 h-8 rounded-full" alt="${coin.symbolClean}">
                                <div class="flex flex-col">
                                    <span class="font-bold text-white text-[15px] leading-tight">${coin.symbolClean}</span>
                                    <span class="text-xs text-[#848e9c] mt-0.5">${coin.fullName}</span>
                                </div>
                            </div>
                            <div class="flex flex-col items-end">
                                <span class="font-semibold text-white text-[15px] leading-tight transition-colors duration-300 ${coin.flash}">
                                    $${formatPrice(coin.price)}
                                </span>
                                <span class="text-xs font-medium text-white px-1.5 py-0.5 rounded mt-1 ${changeBg}">
                                    ${changeSign}${coin.change24h.toFixed(2)}%
                                </span>
                            </div>
                        </div>
                    `;
                });
            }
            container.innerHTML = htmlContent;
            if (focusedElementId === 'searchInput') {
                const input = document.getElementById('searchInput');
                if(input) input.focus();
            }
        }

        function openChart(symbol) {
            currentSelectedSymbol = symbol;
            document.getElementById('modalCoinTitle').innerText = symbol.replace('USDT', '/USDT');
            document.getElementById('chartModal').classList.remove('hidden');
            loadTradingViewChart(symbol, currentTimeframe);
        }

        function closeChartModal() {
            document.getElementById('chartModal').classList.add('hidden');
            document.getElementById('tradingview_container').innerHTML = '';
        }

        function changeTimeframe(tf) {
            currentTimeframe = tf;
            if(tf === '60') {
                document.getElementById('tf1h').className = "px-3 py-1 text-xs font-semibold rounded-md bg-[#fcd535] text-black transition-colors";
                document.getElementById('tf3h').className = "px-3 py-1 text-xs font-semibold rounded-md text-[#848e9c] hover:text-white transition-colors";
            } else {
                document.getElementById('tf3h').className = "px-3 py-1 text-xs font-semibold rounded-md bg-[#fcd535] text-black transition-colors";
                document.getElementById('tf1h').className = "px-3 py-1 text-xs font-semibold rounded-md text-[#848e9c] hover:text-white transition-colors";
            }
            loadTradingViewChart(currentSelectedSymbol, currentTimeframe);
        }

        function loadTradingViewChart(symbol, timeframe) {
            document.getElementById('tradingview_container').innerHTML = '';
            new TradingView.widget({
                "autosize": true,
                "symbol": "BINANCE:" + symbol,
                "interval": timeframe,
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#181a20",
                "enable_publishing": false,
                "hide_top_toolbar": false,
                "hide_legend": false,
                "save_image": false,
                "container_id": "tradingview_container"
            });
        }

        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', () => renderList(allCoins));
        }

        function manualRefresh() {
            const icon = document.getElementById('refreshIcon');
            if(icon) icon.classList.add('rotate-180');
            fetchBinancePrices().then(() => {
                setTimeout(() => {
                    if(icon) icon.classList.remove('rotate-180');
                }, 500);
            });
        }

        function copyAddress(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const icon = btnElement.querySelector('.copy-icon');
                if(icon) {
                    icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>`;
                    icon.classList.add('text-[#0ecb81]');
                    btnElement.classList.add('bg-[#0ecb81]/10');
                    setTimeout(() => {
                        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>`;
                        icon.classList.remove('text-[#0ecb81]');
                        btnElement.classList.remove('bg-[#0ecb81]/10');
                    }, 2000);
                }
            });
        }

        function switchTab(tab) {
            const pricesTab = document.getElementById('pricesTab');
            const donateTab = document.getElementById('donateTab');
            const btnPrices = document.getElementById('btnPrices');
            const btnDonate = document.getElementById('btnDonate');
            const textPrices = document.getElementById('textPrices');
            const textDonate = document.getElementById('textDonate');

            if (tab === 'prices') {
                pricesTab.classList.remove('hidden');
                donateTab.classList.add('hidden');
                btnPrices.classList.replace('bg-transparent', 'bg-[#2b3139]');
                btnPrices.classList.replace('text-[#848e9c]', 'text-white');
                textPrices.classList.remove('max-w-0', 'opacity-0');
                textPrices.classList.add('opacity-100');
                btnDonate.classList.replace('bg-[#2b3139]', 'bg-transparent');
                btnDonate.classList.replace('text-white', 'text-[#848e9c]');
                textDonate.classList.remove('opacity-100');
                textDonate.classList.add('max-w-0', 'opacity-0');
            } else {
                pricesTab.classList.add('hidden');
                donateTab.classList.remove('hidden');
                btnDonate.classList.replace('bg-transparent', 'bg-[#2b3139]');
                btnDonate.classList.replace('text-[#848e9c]', 'text-white');
                textDonate.classList.remove('max-w-0', 'opacity-0');
                textDonate.classList.add('opacity-100');
                btnPrices.classList.replace('bg-[#2b3139]', 'bg-transparent');
                btnPrices.classList.replace('text-white', 'text-[#848e9c]');
                textPrices.classList.remove('opacity-100');
                textDonate.classList.add('max-w-0', 'opacity-0');
            }
        }

        initApp();

        setInterval(() => {
            if (isAppReady) fetchBinancePrices();
        }, 3000);
    </script>
</body>
</html>
