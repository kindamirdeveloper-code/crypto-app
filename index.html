<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مینی‌اپ کریپتو لایو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .pulse-live { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body class="min-h-screen p-4 pb-20">
    <div class="max-w-md mx-auto space-y-4">
        
        <div class="glass-card rounded-2xl p-4 flex items-center justify-between shadow-lg">
            <div>
                <h1 class="text-lg font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">بازار لحظه‌ای ارزهای دیجیتال</h1>
                <p class="text-xs text-gray-400 mt-1">آپدیت خودکار آنی (بدون دکمه)</p>
            </div>
            <div class="flex items-center space-x-2 space-x-reverse bg-green-500/10 border border-green-500/20 px-3 py-1 rounded-full">
                <div class="w-2.5 h-2.5 bg-green-500 rounded-full pulse-live"></div>
                <span class="text-xs text-green-400 font-medium">لایو</span>
            </div>
        </div>

        <div class="relative">
            <input type="text" id="searchInput" placeholder="جستجوی ارز (مثل بیت‌کوین، اتریوم)..." class="w-full glass-card rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white placeholder-gray-500 shadow-inner">
        </div>

        <div id="cryptoList" class="space-y-3">
            <div class="text-center py-12 text-gray-400">در حال دریافت قیمت‌های زنده...</div>
        </div>
    </div>

    <script>
        let allCoins = [];

        async function fetchCryptoPrices() {
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=15&page=1&sparkline=false');
                const data = await response.json();
                allCoins = data;
                renderList(allCoins);
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function renderList(coins) {
            const container = document.getElementById('cryptoList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            container.innerHTML = '';
            
            const filtered = coins.filter(coin => coin.name.toLowerCase().includes(search) || coin.symbol.toLowerCase().includes(search));
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-gray-500 text-sm">ارزی پیدا نشد!</div>';
                return;
            }

            filtered.forEach(coin => {
                const isPositive = coin.price_change_percentage_24h >= 0;
                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl p-4 flex items-center justify-between transition-all hover:border-blue-500/50 shadow-md";
                card.innerHTML = `
                    <div class="flex items-center space-x-3 space-x-reverse">
                        <img src="${coin.image}" alt="${coin.name}" class="w-10 h-10 rounded-full bg-gray-800 p-1">
                        <div>
                            <h3 class="font-bold text-white text-sm">${coin.name}</h3>
                            <span class="text-xs uppercase text-gray-400 font-semibold">${coin.symbol}</span>
                        </div>
                    </div>
                    <div class="text-left">
                        <div class="font-bold text-white text-sm">$${coin.current_price.toLocaleString()}</div>
                        <div class="text-xs font-semibold ${isPositive ? 'text-green-400' : 'text-red-400'} mt-0.5">
                            ${isPositive ? '+' : ''}${coin.price_change_percentage_24h ? coin.price_change_percentage_24h.toFixed(2) : '0.00'}%
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            renderList(allCoins);
        });

        // دریافت اولیه قیمت‌ها
        fetchCryptoPrices();

        // آپدیت خودکار قیمت‌ها هر ۱۰ ثانیه یک‌بار (بدون نیاز به هیچ دکمه‌ای)
        setInterval(fetchCryptoPrices, 10000);
    </script>
</body>
</html>
